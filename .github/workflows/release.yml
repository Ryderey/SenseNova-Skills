name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Canonical release version (X.Y.Z, without v)"
        required: true
        type: string
      notes:
        description: "Optional Markdown release notes"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Require main branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflow must run from main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r skills/sn-image-base/requirements.txt ruff==0.16.5
      - name: Validate release input and repository state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def version_tuple(value: str) -> tuple[int, int, int] | None:
              match = re.fullmatch(r"v?([0-9]+)\.([0-9]+)\.([0-9]+)", value)
              return tuple(map(int, match.groups())) if match else None

          version = os.environ["RELEASE_VERSION"]
          candidate = version_tuple(version)
          if candidate is None:
              raise SystemExit("version must use canonical X.Y.Z format without v")
          manifest = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit(
                  f"release.json version {manifest.get('version')!r} does not match {version!r}"
              )
          repository = os.environ["GITHUB_REPOSITORY"]
          request = Request(
              f"https://api.github.com/repos/{repository}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "SenseNova-Skills-Release-Workflow",
              },
          )
          try:
              with urlopen(request, timeout=10) as response:
                  latest = json.load(response)
          except HTTPError as exc:
              if exc.code != 404:
                  raise
              latest = None
          if latest is not None:
              latest_tag = latest.get("tag_name")
              latest_version = version_tuple(latest_tag) if isinstance(latest_tag, str) else None
              if latest_version is None:
                  raise SystemExit(f"latest release has an invalid tag: {latest_tag!r}")
              if candidate <= latest_version:
                  raise SystemExit(
                      f"version {version} must be strictly newer than latest release {latest_tag}"
                  )
          PY
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          tag="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${tag}")" = "$(git rev-parse HEAD)"
          fi
          release_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$release_draft" = "false" ]; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          if [ "$release_draft" = "true" ]; then
            git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null
            test "$(git rev-list -n 1 "refs/tags/${tag}")" = "$(git rev-parse HEAD)"
          fi
      - name: Unit tests
        run: python -m unittest discover -s skills/sn-image-base/tests -p "test_*.py" -v
      - name: Ruff
        run: python -m ruff check --no-cache skills/sn-image-base/scripts skills/sn-image-base/tests skills/sn-image-doctor/scripts
      - name: Repository scope
        run: python skills/sn-image-doctor/scripts/check_repository_scope.py
      - name: Generate release manifest
        run: python skills/sn-image-doctor/scripts/prepare_release_manifest.py --output sensenova-release.json
      - name: Record validated revision
        id: meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: sensenova-release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-assets
      - name: Verify release asset
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("release.json").read_text(encoding="utf-8"))
          asset = json.loads(
              Path("release-assets/sensenova-release.json").read_text(encoding="utf-8")
          )
          if asset != source:
              raise SystemExit("release asset does not match the validated release.json")
          if asset.get("version") != os.environ["RELEASE_VERSION"]:
              raise SystemExit("release asset version does not match the workflow input")
          PY
      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          notes = os.environ.get("RELEASE_NOTES", "").strip()
          if not notes:
              manifest = json.loads(Path("release.json").read_text(encoding="utf-8"))
              notes = (
                  "## Highlights\n\n"
                  f"- {manifest['summary']}\n\n"
                  "## Verification\n\n"
                  "- Full unittest suite passed.\n"
                  "- Ruff and repository-scope checks passed.\n"
                  "- Release manifest and bundle versions were validated.\n"
              )
          Path(os.environ["RELEASE_NOTES_PATH"]).write_text(
              notes.rstrip() + "\n", encoding="utf-8"
          )
          PY
      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${tag}")" = "$(git rev-parse HEAD)"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" -m "SenseNova Image Skills $tag"
            git push origin "refs/tags/${tag}"
          fi
      - name: Create or update release draft
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${RELEASE_VERSION}"
          release_draft="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$release_draft" = "true" ]; then
            gh release upload "$tag" release-assets/sensenova-release.json \
              --repo "$GH_REPO" --clobber
            gh release edit "$tag" --repo "$GH_REPO" --draft \
              --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$release_draft" = "false" ]; then
            echo "::error::Release $tag is already published"
            exit 1
          else
            gh release create "$tag" release-assets/sensenova-release.json \
              --repo "$GH_REPO" \
              --verify-tag \
              --draft \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish and verify GitHub Release
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${RELEASE_VERSION}"
          gh release edit "$tag" --repo "$GH_REPO" --draft=false --latest
          test "$(gh release view --repo "$GH_REPO" --json tagName --jq '.tagName')" = "$tag"
          test "$(gh release view "$tag" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$tag" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')" = "false"
          local_digest="sha256:$(sha256sum release-assets/sensenova-release.json | cut -d' ' -f1)"
          remote_digest="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[] | select(.name == "sensenova-release.json") | .digest')"
          test "$local_digest" = "$remote_digest"
