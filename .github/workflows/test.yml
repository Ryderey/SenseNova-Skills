name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r skills/sn-image-base/requirements.txt ruff==0.16.5
      - name: Unit tests
        run: python -m unittest discover -s skills/sn-image-base/tests -p "test_*.py" -v
      - name: Ruff
        run: python -m ruff check --no-fix --no-cache skills/sn-image-base/scripts skills/sn-image-base/tests skills/sn-image-doctor/scripts
      - name: Repository scope
        run: python skills/sn-image-doctor/scripts/check_repository_scope.py
